<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSolutions - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">TechSolutions</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="nosotros.html">Nosotros</a>
                <a class="nav-link" href="servicios.html">Servicios</a>
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link active" href="contacto.html">Contacto</a>
            </div>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 600px;">
        <h1 class="text-center mb-4">Contáctenos</h1>
        <form action="confirmacion.html" method="GET" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" required placeholder="Tu nombre">
            </div>
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" required placeholder="correo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Mensaje</label>
                <textarea class="form-control" rows="4" required placeholder="Escribe tu consulta aquí..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar Mensaje</button>
        </form>
    </div>
</body>

</html>
